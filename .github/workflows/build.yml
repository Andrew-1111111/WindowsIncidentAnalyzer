# Builds Windows Incident Analyzer (wia.exe) on Windows and publishes three variants:
#   - anycpu-fdd        framework-dependent, AnyCPU (requires .NET 9 runtime)
#   - win-x64-fdd       framework-dependent, x64   (requires .NET 9 runtime)
#   - win-x64-sc        self-contained, x64        (bundled .NET runtime)
#
# CI: push/PR to main|master → workflow artifacts only.
# Release: push a version tag v* (e.g. v1.0.0) → GitHub Release with all ZIPs attached.

name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and publish (${{ matrix.publish_id }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - publish_id: anycpu-fdd
            rid: ""
            self_contained: false
            artifact_name: wia-anycpu-fdd
          - publish_id: win-x64-fdd
            rid: win-x64
            self_contained: false
            artifact_name: wia-win-x64-fdd
          - publish_id: win-x64-sc
            rid: win-x64
            self_contained: true
            artifact_name: wia-win-x64-self-contained

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore WindowsIncidentAnalyzer.slnx
          if ("${{ matrix.rid }}" -ne "") {
            dotnet restore WindowsIncidentAnalyzer.csproj -r ${{ matrix.rid }}
          }

      - name: Test
        if: matrix.publish_id == 'anycpu-fdd'
        run: dotnet test WindowsIncidentAnalyzer.slnx -c Release --no-restore --verbosity normal

      - name: Publish ${{ matrix.publish_id }}
        shell: pwsh
        run: |
          $output = "${{ runner.temp }}/publish/${{ matrix.publish_id }}"
          $args = @(
            "publish", "WindowsIncidentAnalyzer.csproj",
            "-c", "Release",
            "--no-restore",
            "-o", $output,
            "-p:DebugType=None",
            "-p:DebugSymbols=false"
          )
          if ("${{ matrix.rid }}" -ne "") {
            $args += @("-r", "${{ matrix.rid }}")
          }
          if ("${{ matrix.self_contained }}" -eq "true") {
            $args += @("--self-contained", "true")
          } else {
            $args += @("--self-contained", "false")
          }
          dotnet @args

          $zip = "${{ runner.temp }}/${{ matrix.artifact_name }}.zip"
          Compress-Archive -Path "$output/*" -DestinationPath $zip -Force
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Build summary
        if: matrix.publish_id == 'anycpu-fdd'
        shell: pwsh
        run: |
          @"
          ## Build artifacts
          | Variant | RID | Self-contained | .NET runtime required |
          | --- | --- | --- | --- |
          | **wia-anycpu-fdd** | (default / AnyCPU) | No | Yes (.NET 9) |
          | **wia-win-x64-fdd** | win-x64 | No | Yes (.NET 9) |
          | **wia-win-x64-self-contained** | win-x64 | Yes | No |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wia-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Windows Incident Analyzer ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Package | Description |
            | --- | --- |
            | `wia-anycpu-fdd.zip` | Framework-dependent AnyCPU build (requires [.NET 9 runtime](https://dotnet.microsoft.com/download)) |
            | `wia-win-x64-fdd.zip` | Framework-dependent x64 build (requires .NET 9 runtime) |
            | `wia-win-x64-self-contained.zip` | Self-contained x64 build (no separate runtime install) |

            Extract the ZIP, run `wia.exe`. Data is stored under `data/` next to the executable.

            **Recommended for most users:** `wia-win-x64-self-contained.zip`
          files: release/*.zip
          fail_on_unmatched_files: true
